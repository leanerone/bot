llm:
  mock: true
  # provider: openai(默认, 任意 OpenAI 格式) | azure(v1 兼容端点) | azure-classic(deployment URL)
  provider: openai
  base_url: http://127.0.0.1:8000/v1
  # Azure 示例: base_url: https://<资源名>.openai.azure.com/openai/v1, api_key: <Azure密钥>, model: <部署名>
  api_version: "2024-10-21"      # 仅 azure-classic 使用
  api_key: EMPTY
  model: Qwen2.5-32B-Instruct-AWQ
  timeout: 120
  fallback_mock: true            # 云端不可达时自动降级 Mock (回答首行标注)
rag:
  knowledge_path: data/knowledge
  store_path: data/vector_store
  chunk_size: 500
  chunk_overlap: 80
  top_k: 6
  hybrid: true
  rerank:
    provider: off                # off(默认, 规则降级) | vllm(/v1/rerank 端点) | local(CrossEncoder)
    model: BAAI/bge-reranker-v2-m3
    top_n: 6
  embedding:
    provider: mock
    base_url: http://127.0.0.1:8001/v1
    model: bge-m3
sqlbot:
  db_path: data/demo/fab_demo.db
  max_rows: 200
audit:
  path: data/audit.log
  mask_pii: true                 # 审计落盘前脱敏 手机号/邮箱/IP
  max_text_len: 200              # 审计正文截断 (0=不截断)
watcher:
  enabled: false
  interval_minutes: 10
  levels:
  - ALARM
  - CRITICAL
  platform: teams
notify:
  teams_webhook: ''              # Teams: O365 Connector Incoming Webhook 或 Power Automate 触发器 URL
  teams_format: connector        # connector(MessageCard) | flow(Adaptive Card, 推荐)
  wechat_webhook: ''
  dingtalk_webhook: ''
  feishu_webhook: ''
store:
  db_path: data/app.db
auth:
  token_ttl_hours: 24
  cookie_secure: false
  trusted_proxies: []            # B2: 可信反代 IP 列表; 仅这些直连来源才采信 X-Forwarded-For
  bootstrap_users:
  - username: admin
    password: admin123
    role: admin
    display_name: 管理员
  - username: zhangsan
    password: user123
    role: user
    display_name: 张工
  - username: guest
    password: guest123
    role: viewer
    display_name: 访客
notes:
  mode: export
  export_dir: data/notes_export
  domino:
    base_url: https://domino.example.com
    db_path: KB/process.nsf
    view: ($All)
    username: ''
    password: ''
  # 多库支持 (B5): 逐库增量拉取; 留空则退回上方单库配置
  databases: []                  # 例: [{db_path: KB/process.nsf, view: "($All)"}, {db_path: KB/dev.nsf}]
  sync:
    interval_minutes: 0          # >0 时启用定时增量同步守护 (0=关闭)
mcp:
  require_key: false             # streamable-http 模式要求 X-FabBot-Key 头 (跨机消费建议 true)
  key: ''
ratelimit:
  chat_per_minute: 30
  login_per_5min: 10
auth_lock:
  max_failures: 5                # 窗口内最大失败次数 (C2 登录防爆破)
  window_minutes: 10
  lock_minutes: 15
  admin_per_minute: 3            # B1: admin 豁免锁定但加全局限速 (防换 IP 爆破唯一入口)
intent:
  model_margin: 2                # E2: 关键词得分与阈值差 >= 此值时短路, 不调模型分类
  min_confidence: 0.6            # 模型分类最低置信度 (低于则回退关键词)
agent:
  max_steps: 3                   # C4: ReAct 循环最大决策轮数
skillhub:
  secrets: {}                    # D4: 技能密钥 (Fernet 加密值, fernet:<密文>); 不落日志
  fernet_key: ''                 # Fernet 主密钥 (base64); 留空则明文密钥仅内网自用
cors:
  allow_origins:                 # B3: 跨域白名单 (桌面同源无需 CORS); ['*'] 放开但不带凭证
  - http://127.0.0.1:8100
  - http://localhost:8100
logging:
  level: INFO                    # C6: DEBUG/INFO/WARNING/ERROR
  file: ''                       # 日志文件 (相对项目根, 空=仅控制台); 例 data/fabbot.log
